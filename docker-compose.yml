services:
  cassandra:
    image: cassandra:4.1
    container_name: co2-cassandra
    ports:
      - "9042:9042"          # CQL native transport (host access for tools)
    environment:
      - CASSANDRA_CLUSTER_NAME=co2
      - MAX_HEAP_SIZE=2G
      - HEAP_NEWSIZE=400M
    volumes:
      - cassandra-data:/var/lib/cassandra
    healthcheck:
      # cqlsh exits 0 only once CQL is actually accepting queries
      test: ["CMD-SHELL", "cqlsh -e 'describe keyspaces' >/dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 60s

  # One-shot: applies schema, then loads CSVs. Exits when done.
  loader:
    build: ./loader
    container_name: co2-loader
    depends_on:
      cassandra:
        condition: service_healthy
    environment:
      - CASSANDRA_HOST=cassandra
      - DATA_ROOT=/data/DEU/DATA
      - SCHEMA_FILE=/schema/schema.cql
    volumes:
      - ./DEU:/data/DEU:ro
      - ./cassandra:/schema:ro
    # Override at runtime, e.g.:
    #   docker compose run --rm loader python load.py --types country_emissions
    command: ["python", "load.py", "--apply-schema", "--types", "country_emissions"]

  api:
    build: ./api
    container_name: co2-api
    depends_on:
      cassandra:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      - CASSANDRA_HOST=cassandra
      - PORT=8080

  web:
    build: ./web
    container_name: co2-web
    depends_on:
      - api
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - VITE_USE_POLLING=1
    # Dev mode: bind-mount the source for hot reload, but keep the image's
    # Linux node_modules (anonymous volume shadows the host's copy).
    # claude-config persists Claude Code's login/settings across recreates.
    volumes:
      - ./web:/app
      - /app/node_modules
      - claude-config:/root/.claude
    command: ["npm", "run", "dev"]

  # One-shot: compiles the Kotlin Spark job into spark/kotlin/build/libs/analysis.jar.
  #   docker compose run --rm spark-build
  spark-build:
    image: gradle:8.7-jdk17
    container_name: co2-spark-build
    working_dir: /home/gradle/project
    volumes:
      - ./spark/kotlin:/home/gradle/project
      - gradle-cache:/home/gradle/.gradle
    command: ["gradle", "--no-daemon", "shadowJar"]

  # Long-running dev box for the Kotlin Spark job. Attach VS Code (Dev
  # Containers: Attach to Running Container) + install the Kotlin extension to
  # edit with full dependency resolution — the Spark jars come from the shared
  # gradle-cache volume. Rebuild inside with `gradle shadowJar` (or
  # `gradle -t shadowJar` for continuous rebuild on save); output lands in
  # build/libs/analysis.jar, which the `spark` service mounts at /jars.
  spark-dev:
    image: gradle:8.7-jdk17
    container_name: co2-spark-dev
    working_dir: /home/gradle/project
    volumes:
      - ./spark/kotlin:/home/gradle/project
      - gradle-cache:/home/gradle/.gradle
    command: ["sleep", "infinity"]

  spark:
    image: apache/spark:3.5.3
    container_name: co2-spark
    depends_on:
      cassandra:
        condition: service_healthy
    environment:
      - CASSANDRA_HOST=cassandra
    volumes:
      - ./spark/kotlin/build/libs:/jars:ro
    # Idle by default. Build the jar first (spark-build), then submit it:
    #   docker compose run --rm spark /opt/spark/bin/spark-submit \
    #     --packages com.datastax.spark:spark-cassandra-connector_2.12:3.5.1 \
    #     --conf spark.jars.ivy=/tmp/.ivy --class co2.AnalysisKt /jars/analysis.jar
    entrypoint: [""]
    command: ["tail", "-f", "/dev/null"]

volumes:
  cassandra-data:
  claude-config:
  gradle-cache:
